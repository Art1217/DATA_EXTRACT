name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: pip install ".[gcp,claude,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t document-extraction-ai .

      - name: Arrancar en modo demo y comprobar la salud
        run: |
          docker run -d --name api -p 8000:8000 document-extraction-ai
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs api
          exit 1
